<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects | Aaron Underhill</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
</head>


<body>

    <header>

        <nav>

            <a href="index.html">Aaron Underhill</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="about.html">About</a>
            </div>

        </nav>

        <button id="theme-toggle" type="button">
            Tech Theme
        </button>

    </header>


    <main>

        <section class="projects-page">

            <h1>Projects</h1>

            <p class="projects-intro">
                Explore my software engineering, data science,
                cybersecurity, and other technical projects.
            </p>


            <div class="project-tools">

                <label for="project-search">
                    Search Projects
                </label>

                <input type="search" id="project-search" placeholder="Search by project, technology, or category...">

            </div>

            <p class="filter-label">
                Filter by Category
            </p>

            <div class="project-filters">

                <button type="button" data-category="All">
                    All
                </button>

                <button type="button" data-category="Software Engineering">
                    Software
                </button>

                <button type="button" data-category="Data Science">
                    Data Science
                </button>

                <button type="button" data-category="Cybersecurity">
                    Cybersecurity
                </button>

            </div>


            <div id="project-grid" class="project-grid"></div>

        </section>

    </main>


    <footer>

        <p>© Aaron Underhill</p>

    </footer>


    <script src="script.js"></script>
    <script src="projects.js"></script>
