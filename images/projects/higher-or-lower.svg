<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t">
  <title id="t">Diagram of the game: two movie posters side by side, and the player picks which movie is rated higher</title>
  <rect width="800" height="500" fill="#1f2433"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- movie A -->
    <g transform="translate(150 70)">
      <rect width="200" height="290" rx="14" fill="#2f3650" stroke="#4a5375" stroke-width="2"/>
      <rect x="20" y="20" width="160" height="200" rx="8" fill="#3f6f9e"/>
      <circle cx="100" cy="105" r="38" fill="#7fb0dd" fill-opacity="0.55"/>
      <rect x="35" y="236" width="130" height="12" rx="6" fill="#cfd5e6"/>
      <text x="100" y="275" font-size="19" font-weight="700" fill="#f4c95d">★ 7.8</text>
    </g>

    <!-- VS -->
    <circle cx="400" cy="215" r="34" fill="#f4c95d"/>
    <text x="400" y="224" font-size="22" font-weight="800" fill="#1f2433">VS</text>

    <!-- movie B -->
    <g transform="translate(450 70)">
      <rect width="200" height="290" rx="14" fill="#2f3650" stroke="#f4c95d" stroke-width="3"/>
      <rect x="20" y="20" width="160" height="200" rx="8" fill="#9e4a5a"/>
      <circle cx="100" cy="105" r="38" fill="#e58e9d" fill-opacity="0.55"/>
      <rect x="35" y="236" width="130" height="12" rx="6" fill="#cfd5e6"/>
      <text x="100" y="275" font-size="22" font-weight="800" fill="#f4c95d">?</text>
    </g>

    <text x="400" y="420" font-size="24" font-weight="700" fill="#ffffff">Higher or lower?</text>
    <text x="400" y="452" font-size="15" fill="#aab2c8">Guess which movie is rated higher</text>
  </g>
</svg>
