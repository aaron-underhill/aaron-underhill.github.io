<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t">
  <title id="t">Diagram: 46,000 text messages are embedded, the most similar past conversations are retrieved, and a reply is generated in the same style</title>
  <rect width="800" height="500" fill="#ece9f4"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- 1. message history -->
    <g transform="translate(40 110)">
      <rect width="190" height="230" rx="18" fill="#ffffff" stroke="#d3cde6"/>
      <rect x="18" y="22" width="110" height="26" rx="13" fill="#d9d4ea"/>
      <rect x="62" y="60" width="110" height="26" rx="13" fill="#6a5acd"/>
      <rect x="18" y="98" width="90" height="26" rx="13" fill="#d9d4ea"/>
      <rect x="18" y="136" width="125" height="26" rx="13" fill="#d9d4ea"/>
      <rect x="82" y="174" width="90" height="26" rx="13" fill="#6a5acd"/>
      <text x="95" y="268" font-size="17" font-weight="700" fill="#2e2a45">46K messages</text>
    </g>

    <!-- arrow -->
    <path d="M248 225 H298" stroke="#8c84b4" stroke-width="4" fill="none"/>
    <path d="M298 215 L314 225 L298 235 Z" fill="#8c84b4"/>

    <!-- 2. embeddings + retrieval -->
    <g transform="translate(325 110)">
      <rect width="190" height="230" rx="18" fill="#ffffff" stroke="#d3cde6"/>
      <g fill="#c4bde0">
        <circle cx="40" cy="50" r="7"/><circle cx="150" cy="40" r="7"/>
        <circle cx="30" cy="160" r="7"/><circle cx="160" cy="175" r="7"/>
        <circle cx="70" cy="195" r="7"/><circle cx="140" cy="105" r="7"/>
        <circle cx="45" cy="110" r="7"/>
      </g>
      <circle cx="95" cy="115" r="42" fill="#6a5acd" fill-opacity="0.12" stroke="#6a5acd" stroke-width="2.5" stroke-dasharray="7 6"/>
      <circle cx="95" cy="115" r="9" fill="#e07a5f"/>
      <g fill="#6a5acd">
        <circle cx="75" cy="95" r="7"/><circle cx="118" cy="128" r="7"/><circle cx="88" cy="142" r="7"/>
      </g>
      <text x="95" y="268" font-size="17" font-weight="700" fill="#2e2a45">Find similar chats</text>
    </g>

    <!-- arrow -->
    <path d="M533 225 H583" stroke="#8c84b4" stroke-width="4" fill="none"/>
    <path d="M583 215 L599 225 L583 235 Z" fill="#8c84b4"/>

    <!-- 3. reply -->
    <g transform="translate(610 110)">
      <rect width="150" height="230" rx="18" fill="#ffffff" stroke="#d3cde6"/>
      <rect x="18" y="70" width="95" height="26" rx="13" fill="#d9d4ea"/>
      <rect x="42" y="112" width="90" height="26" rx="13" fill="#e07a5f"/>
      <text x="75" y="268" font-size="17" font-weight="700" fill="#2e2a45">Reply in style</text>
    </g>
  </g>
</svg>
